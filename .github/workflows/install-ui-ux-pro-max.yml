name: Install UI UX Pro Max skill

on:
  push:
    branches:
      - install-ui-ux-pro-max-skill

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: install-ui-ux-pro-max-skill
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install UI UX Pro Max CLI
        run: npm install -g ui-ux-pro-max-cli

      - name: Install Codex skill into repository
        run: uipro init --ai codex --force

      - name: Commit generated skill and remove installer
        run: |
          rm -f .github/workflows/install-ui-ux-pro-max.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes found"
            exit 1
          fi
          git commit -m "Install UI UX Pro Max Codex skill"
          git push origin HEAD:install-ui-ux-pro-max-skill
